services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: truent
      POSTGRES_USER: truent
      POSTGRES_PASSWORD: truent-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truent -d truent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - truent-postgres:/var/lib/postgresql/data

volumes:
  truent-postgres:
