[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/dsl_parser",
    "crates/ir",
    "crates/analyzer/solana",
    "crates/analyzer/evm",
    "crates/analyzer/move",
    "crates/analyzer/soroban",
    "crates/analyzer/general",
    "crates/sca",
    "crates/pathways",
    "crates/runtime",
    "crates/symbolic",
    "crates/dynamic/core",
    "crates/dynamic/evm",
    "crates/dynamic/solana",
    "crates/generator/solana",
    "crates/generator/solana_macro",
    "crates/generator/evm",
    "crates/generator/move",
    "crates/invariant_library",
    "crates/report",
    "crates/skills",
    "crates/utils",
]

resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.75"
authors = ["Truent Contributors"]
license = "MIT"
homepage = "https://github.com/Emmyhack/Truent"
repository = "https://github.com/Emmyhack/Truent"
documentation = "https://docs.rs/truent-cli"

[workspace.dependencies]
# Internal crates
truent-core = { path = "crates/core", version = "0.6.0" }
truent-utils = { path = "crates/utils", version = "0.6.0" }
truent-ir = { path = "crates/ir", version = "0.6.0" }
truent-dsl-parser = { path = "crates/dsl_parser", version = "0.6.0" }
truent-analyzer-solana = { path = "crates/analyzer/solana", version = "0.6.0" }
truent-analyzer-evm = { path = "crates/analyzer/evm", version = "0.6.0" }
truent-analyzer-move = { path = "crates/analyzer/move", version = "0.6.0" }
truent-analyzer-soroban = { path = "crates/analyzer/soroban", version = "0.6.0" }
truent-analyzer-general = { path = "crates/analyzer/general", version = "0.6.0" }
truent-sca = { path = "crates/sca", version = "0.6.0" }
truent-pathways = { path = "crates/pathways", version = "0.6.0" }
truent-runtime = { path = "crates/runtime", version = "0.6.0" }
truent-symbolic = { path = "crates/symbolic", version = "0.6.0" }
truent-dynamic-core = { path = "crates/dynamic/core", version = "0.6.0" }
truent-dynamic-evm = { path = "crates/dynamic/evm", version = "0.6.0" }
truent-dynamic-solana = { path = "crates/dynamic/solana", version = "0.6.0" }
truent-generator-solana = { path = "crates/generator/solana", version = "0.6.0" }
truent-solana-macro = { path = "crates/generator/solana_macro", version = "0.6.0" }
truent-generator-evm = { path = "crates/generator/evm", version = "0.6.0" }
truent-generator-move = { path = "crates/generator/move", version = "0.6.0" }
truent-library = { path = "crates/invariant_library", version = "0.6.0" }
truent-report = { path = "crates/report", version = "0.6.0" }
truent-skills = { path = "crates/skills", version = "0.6.0" }

# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Parsing
pest = "2.7"
pest_derive = "2.7"
nom = "7.1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# Solidity/EVM specific
solc = "0.0.9"
revm = { version = "14", features = [
    "std",
    "serde",
    "optional_block_gas_limit",
    "optional_eip3607",
    "optional_no_base_fee",
] }
ureq = { version = "2", features = ["json"] }
sha3 = "0.10"
hex = "0.4"

# Code analysis
petgraph = { version = "0.6", features = ["serde-1"] }
tree-sitter = "0.20"
tree-sitter-solidity = "1.2"
cc = "1.0"

# Terminal UI
terminal_size = "0.3"

# Solana
solana-program = "1"
solana-sdk = "1"

# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }
colored = "2.0"

# Testing & fuzzing
proptest = "1.4"
rand = { version = "0.8", features = ["small_rng"] }
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1.34", features = ["json"] }
criterion = { version = "0.5" }
tempfile = "3.8"
# serde_yaml is unmaintained (RUSTSEC-2024-0370). serde_yaml_ng is the
# maintained drop-in fork with the same API.
serde_yaml_ng = "0.10"
walkdir = "2.5"

# Parallel processing
rayon = "1.7"

# Utilities
regex = "1.10"
lazy_static = "1.4"
log = "0.4"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true