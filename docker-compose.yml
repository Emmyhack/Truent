# Truent, production-shaped, on one machine: database, migrations, dashboard,
# scan worker. `cp deploy/env.example .env`, fill it in, `docker compose up -d`.
# The same file runs on a laptop, an Oracle Always Free VM, or a paid host.

# Every image shares the same build arguments so Docker builds the web stage
# once and reuses it for the migrate and worker images.
x-build-args: &build-args
  NEXT_PUBLIC_CIVIC_CLIENT_ID: ${NEXT_PUBLIC_CIVIC_CLIENT_ID:-}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: truent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: truent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truent -d truent"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
      args: *build-args
    environment:
      DATABASE_URL: postgresql://truent:${POSTGRES_PASSWORD}@db:5432/truent
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build:
      context: .
      target: web
      args: *build-args
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://truent:${POSTGRES_PASSWORD}@db:5432/truent
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3080}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      PAYMENT_RECEIVER_ADDRESS: ${PAYMENT_RECEIVER_ADDRESS:-}
    ports:
      - "${WEB_PORT:-3080}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build:
      context: .
      target: worker
      args: *build-args
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://truent:${POSTGRES_PASSWORD}@db:5432/truent
      SCAN_WORKER_POLL_MS: ${SCAN_WORKER_POLL_MS:-1000}
      SCAN_MAX_ATTEMPTS: ${SCAN_MAX_ATTEMPTS:-3}
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Two workers scan in parallel; claims are row-locked so they never collide.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  pgdata:
