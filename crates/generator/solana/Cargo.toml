[package]
name = "truent-generator-solana"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

description = "Truent: Code generator for Solana programs using Truent invariants and security constraints."

keywords = ["truent", "solana", "security", "smart-contracts", "codegen"]
categories = ["development-tools", "development-tools::testing"]
readme = "README.md"
documentation = "https://docs.rs/truent-generator-solana"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
truent-core.workspace = true
truent-ir.workspace = true
truent-utils.workspace = true
truent-analyzer-solana.workspace = true
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

[dev-dependencies]
proptest.workspace = true
