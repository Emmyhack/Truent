[package]
name = "truent-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

description = "Truent: Core types and utilities for the Truent multi-chain smart contract security analyzer."

keywords = ["truent", "solana", "security", "smart-contracts", "static-analysis"]
categories = ["development-tools", "development-tools::testing"]
readme = "README.md"
documentation = "https://docs.rs/truent-core"

# Compiles the workspace's .sinv DSL files into src/generated/invariants.rs.
# Lives at the workspace root, which is a *virtual* manifest — cargo never runs
# a build script there, so it has to be attached to a real package to execute.
build = "../../build.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
regex.workspace = true
once_cell.workspace = true

[dev-dependencies]
proptest.workspace = true
