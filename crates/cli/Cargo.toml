[package]
name = "truent-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

description = "Truent: multi-chain smart contract security analyzer with static analysis, invariant checking, and vulnerability detection for Solana, EVM, and Move programs."

keywords = ["truent", "solana", "smart-contracts", "security", "static-analysis"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
readme = "../../README.md"
documentation = "https://docs.rs/truent-cli"
[[bin]]
name = "truent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
colored.workspace = true
terminal_size.workspace = true
truent-core.workspace = true
truent-ir.workspace = true
truent-dsl-parser.workspace = true
truent-utils.workspace = true
truent-library.workspace = true
truent-report.workspace = true
truent-skills.workspace = true
truent-analyzer-solana.workspace = true
truent-analyzer-evm.workspace = true
truent-analyzer-move.workspace = true
truent-analyzer-soroban.workspace = true
truent-analyzer-general.workspace = true
truent-sca.workspace = true
truent-pathways.workspace = true
truent-runtime.workspace = true
truent-symbolic.workspace = true
truent-generator-solana.workspace = true
truent-generator-evm.workspace = true
truent-generator-move.workspace = true
truent-dynamic-core.workspace = true
truent-dynamic-evm = { workspace = true, features = ["revm-backend"] }
truent-dynamic-solana.workspace = true
hex.workspace = true

[dev-dependencies]
insta.workspace = true
criterion.workspace = true
tempfile = "3.8"
proptest.workspace = true
regex.workspace = true
assert_cmd.workspace = true
predicates.workspace = true


[[bench]]
name = "scan"
harness = false
