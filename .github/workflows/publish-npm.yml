name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver)"
        required: true
        type: string

env:
  NODE_VERSION: "18"

permissions:
  contents: read
  packages: write

jobs:
  # Extract version from release
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Get version from release
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual dispatch
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            # Automatic from release
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            TAG="${{ github.event.release.tag_name }}"
          fi
          
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)? ]]; then
            echo "ERROR: Invalid semver: $VERSION"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✓ Extracted version: $VERSION (tag: $TAG)"

  # Verify crates.io publishing completed
  wait-crates-io:
    name: Verify crates.io Publishing
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Wait for crates.io availability
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          MAX_RETRIES=40
          RETRY_DELAY=30

          # Queries the registry API for the exact version rather than
          # `cargo search`. Search is a separate, eventually-consistent index
          # that can lag publication by well over the old 5-minute budget — it
          # failed the v0.5.0 release that way, after all 18 crates had in fact
          # published. The API knows as soon as the upload lands.
          #
          # crates.io rejects requests without a User-Agent, so send one.
          URL="https://crates.io/api/v1/crates/truent-cli/$VERSION"

          echo "Verifying truent-cli v$VERSION on crates.io (up to $((MAX_RETRIES * RETRY_DELAY / 60)) min)..."

          for i in $(seq 1 $MAX_RETRIES); do
            CODE=$(curl -s -o /tmp/crates_check.json -w '%{http_code}' \
              -A "truent-release-pipeline (https://github.com/geekstrancend/Truent)" \
              --max-time 30 "$URL" || echo 000)

            if [ "$CODE" = "200" ]; then
              echo "✓ truent-cli v$VERSION found on crates.io"
              exit 0
            fi

            echo "Attempt $i/$MAX_RETRIES — HTTP $CODE, waiting ${RETRY_DELAY}s..."
            [ $i -lt $MAX_RETRIES ] && sleep $RETRY_DELAY
          done

          echo "::error::truent-cli v$VERSION never appeared on crates.io after ${MAX_RETRIES} attempts."
          echo "The npm wrapper resolves the published crate, so publishing it now would ship"
          echo "a package pointing at a version that does not exist. Failing instead."
          exit 1

  # Build npm package
  build-npm:
    name: Build npm Package
    runs-on: ubuntu-latest
    needs: [extract-version, wait-crates-io]
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        run: cargo install cross --locked
        continue-on-error: true

      - name: Setup target-specific tools
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get update && sudo apt-get install -y musl-tools
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
          esac

      - name: Build release binary
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              ;;
          esac
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Determine binary name
        id: binary
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            echo "name=truent.exe" >> $GITHUB_OUTPUT
          else
            echo "name=truent" >> $GITHUB_OUTPUT
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ steps.binary.outputs.name }}
          retention-days: 1

  # Package npm distribution
  package-npm:
    name: Package npm Distribution
    runs-on: ubuntu-latest
    needs: [extract-version, build-npm]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./binaries

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Update npm package version
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          
          cd truent-npm
          
          # Update package.json version
          npm version "$VERSION" --no-git-tag-version
          
          echo "✓ Updated truent-npm to v$VERSION"
          cat package.json | grep '"version"'

      - name: Organize binaries for npm
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          mkdir -p truent-npm/bin/releases
          
          # Organize binaries by platform
          mkdir -p truent-npm/bin/releases/{linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64}
          
          # Linux x86_64 (glibc)
          if [ -f binaries/binary-x86_64-unknown-linux-gnu/truent ]; then
            cp binaries/binary-x86_64-unknown-linux-gnu/truent truent-npm/bin/releases/linux-x64/truent
            chmod +x truent-npm/bin/releases/linux-x64/truent
          fi
          
          # Linux x86_64 (musl)
          if [ -f binaries/binary-x86_64-unknown-linux-musl/truent ]; then
            cp binaries/binary-x86_64-unknown-linux-musl/truent truent-npm/bin/releases/linux-x64/truent-musl
            chmod +x truent-npm/bin/releases/linux-x64/truent-musl
          fi
          
          # Linux aarch64
          if [ -f binaries/binary-aarch64-unknown-linux-gnu/truent ]; then
            cp binaries/binary-aarch64-unknown-linux-gnu/truent truent-npm/bin/releases/linux-arm64/truent
            chmod +x truent-npm/bin/releases/linux-arm64/truent
          fi
          
          # macOS x86_64
          if [ -f binaries/binary-x86_64-apple-darwin/truent ]; then
            cp binaries/binary-x86_64-apple-darwin/truent truent-npm/bin/releases/darwin-x64/truent
            chmod +x truent-npm/bin/releases/darwin-x64/truent
          fi
          
          # macOS aarch64
          if [ -f binaries/binary-aarch64-apple-darwin/truent ]; then
            cp binaries/binary-aarch64-apple-darwin/truent truent-npm/bin/releases/darwin-arm64/truent
            chmod +x truent-npm/bin/releases/darwin-arm64/truent
          fi
          
          # Windows x86_64
          if [ -f binaries/binary-x86_64-pc-windows-msvc/truent.exe ]; then
            cp binaries/binary-x86_64-pc-windows-msvc/truent.exe truent-npm/bin/releases/win32-x64/truent.exe
          fi
          
          echo "✓ Organized binaries:"
          find truent-npm/bin/releases -type f -exec ls -lh {} \;

      - name: Verify npm structure
        run: |
          cd truent-npm
          
          echo "Package structure:"
          ls -la
          
          echo ""
          echo "Index file:"
          head -20 index.js
          
          echo ""
          echo "Type definitions:"
          head -20 index.d.ts

      - name: Create npm tarball
        run: |
          cd truent-npm
          npm pack
          
          TARBALL=$(ls truent-*.tgz 2>/dev/null | head -1)
          if [ -n "$TARBALL" ]; then
            mv "$TARBALL" ../truent-npm-${{ needs.extract-version.outputs.version }}.tgz
            echo "✓ Created: truent-npm-${{ needs.extract-version.outputs.version }}.tgz"
          fi

      - name: Upload npm package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: truent-npm-${{ needs.extract-version.outputs.version }}.tgz
          retention-days: 1

  # Test npm package
  test-npm:
    name: Test npm Package
    runs-on: ${{ matrix.os }}
    needs: [extract-version, package-npm]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["18", "20"]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package

      - name: Install from tarball
        run: |
          npm install truent-npm-${{ needs.extract-version.outputs.version }}.tgz -g

      - name: Test truent command
        run: |
          truent --version
          truent --help
          truent doctor

  # Publish to npm
  publish-npm:
    name: Publish to npm Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm --provenance: publishes a signed build attestation
    needs: [extract-version, test-npm]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Download npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: ./

      - name: Extract and verify package
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          TARBALL="truent-npm-${VERSION}.tgz"
          
          if [ ! -f "$TARBALL" ]; then
            echo "ERROR: npm package not found: $TARBALL"
            ls -la
            exit 1
          fi
          
          echo "✓ Found npm package: $TARBALL"
          tar -tzf "$TARBALL" | head -20

      - name: Publish to npm public registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          TARBALL="truent-npm-${VERSION}.tgz"
          
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured — cannot publish to npm."
            echo "A release that publishes nothing must fail rather than report success."
            echo "Set the NPM_TOKEN GitHub secret, then re-run this release."
            exit 1
          fi
          
          echo "Publishing @dextonicx/cli@$VERSION to npm..."
          
          npm publish "$TARBALL" --access public --provenance
          
          echo "✓ Published to npm successfully"

      - name: Verify npm publication
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          MAX_RETRIES=10
          RETRY_DELAY=5
          
          echo "Verifying @dextonicx/cli@$VERSION on npm..."
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            if npm view @dextonicx/cli@"$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
              echo "✓ @dextonicx/cli@$VERSION published successfully"
              npm view @dextonicx/cli@"$VERSION"
              exit 0
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "  Not yet visible, waiting ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "⚠ Could not verify publication after ${MAX_RETRIES} attempts"
          echo "This may be expected for newly published packages"

  # Update release notes with npm link
  update-release:
    name: Update GitHub Release Notes
    runs-on: ubuntu-latest
    needs: [extract-version, publish-npm]
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.extract-version.outputs.tag }}

      - name: Update release notes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const version = "${{ needs.extract-version.outputs.version }}";
            const npmLink = `https://www.npmjs.com/package/@dextonicx/cli/v/${version}`;
            const caratesLink = `https://crates.io/crates/truent-cli/${version}`;
            
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: "${{ needs.extract-version.outputs.tag }}",
            });
            
            const body = release.data.body + `\n\n## Package Links\n\n- **npm**: [@dextonicx/cli@${version}](${npmLink})\n- **crates.io**: [truent-cli v${version}](${caratesLink})\n`;
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: body,
            });

  # Final status
  publish-complete:
    name: npm Publication Complete
    runs-on: ubuntu-latest
    needs: [extract-version, publish-npm, update-release]
    if: success()
    steps:
      - name: Publication Summary
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          echo "=========================================="
          echo "✓ TRUENT v${VERSION}"
          echo "  NPM PUBLICATION COMPLETED"
          echo "=========================================="
          echo ""
          echo "Package Published:"
          echo "  npm: @dextonicx/cli@${VERSION}"
          echo "  crates.io: truent-cli v${VERSION}"
          echo ""
          echo "Installation:"
          echo "  npm install -g @dextonicx/cli"
          echo "  cargo install truent-cli"
          echo ""
          echo "Links:"
          echo "  https://www.npmjs.com/package/@dextonicx/cli/v/${VERSION}"
          echo "  https://crates.io/crates/truent-cli/${VERSION}"
