name: CI - Production Grade

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTFLAGS: -D warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Strict formatting check
  format:
    name: Format Check (Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Check formatting
        run: cargo fmt --all -- --check
        
  # Strict linting with all warnings as errors
  clippy:
    name: Clippy Lint (Strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Run clippy strict
        run: cargo clippy --all --all-targets --all-features -- -D warnings -D clippy::all
        
  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
        continue-on-error: true
      
      - name: Run security audit
        run: cargo audit
      
  # Unit tests across all platforms
  test:
    name: Unit Tests (${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.rust }}
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Run unit tests
        run: cargo test --lib --all --verbose
        
      - name: Run doc tests
        run: cargo test --doc --all
        
  # Beta Rust tests (experimental, non-blocking)
  test-beta:
    name: Unit Tests (beta)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: beta
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Run unit tests
        run: cargo test --lib --all --verbose
        
      - name: Run doc tests
        run: cargo test --doc --all
        
  # Property-based tests
  property-tests:
    name: Property Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Run property tests
        run: cargo test --tests --verbose
        
  # Security-specific tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Run security tests
        run: cargo test --tests --verbose
        
  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Run integration tests
        run: cargo test --tests --verbose
        
  # CLI behavior tests
  cli-tests:
    name: CLI Behavior Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Build CLI
        run: cargo build --release --bin truent
      
      # v0.1: Test doctor command in CI (non-TTY environment)
      - name: Run doctor command
        run: cargo run --bin truent -- doctor
        
      # v0.1: Verify JSON output is valid JSON (non-TTY safety check)
      - name: Verify JSON output is valid JSON
        run: |
          cargo run --bin truent -- check . --chain evm --format json --output /tmp/truent-output.json || true
          if [ -f /tmp/truent-output.json ]; then
            if python3 -c "import json,sys; json.load(open('/tmp/truent-output.json'))"; then
              echo "✓ JSON output is valid and free of ANSI codes"
            else
              echo "✗ JSON output is malformed — likely ANSI codes in output"
              cat /tmp/truent-output.json
              exit 1
            fi
          else
            echo "ℹ No JSON output file produced — skipping validation"
          fi
        shell: bash
        
      - name: Run CLI tests
        run: cargo test --tests --verbose
        
  # v0.1: CLI smoke test on all platforms (verifies subcommands work across OSes)
  cli-smoke-test:
    name: CLI Smoke Test
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            bin: ./target/release/truent
          - os: macos-latest
            bin: ./target/release/truent
          - os: windows-latest
            bin: ./target/release/truent.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Build release binary
        run: cargo build --release --bin truent
        
      - name: Verify --version
        run: ${{ matrix.bin }} --version
        shell: bash
        
      - name: Verify --help
        run: ${{ matrix.bin }} --help
        shell: bash
        
      - name: Verify check --help
        run: ${{ matrix.bin }} check --help
        shell: bash
        
      - name: Verify doctor exits cleanly
        run: ${{ matrix.bin }} doctor
        shell: bash
        
      - name: Verify init creates config (Unix)
        run: |
          mkdir -p /tmp/test-init
          ${{ matrix.bin }} init /tmp/test-init
          test -f /tmp/test-init/.truent.toml
        shell: bash
        if: runner.os != 'Windows'
        
      - name: Verify init creates config (Windows)
        run: |
          New-Item -ItemType Directory -Force -Path $env:TEMP\test-init
          .\target\release\truent.exe init $env:TEMP\test-init
          Test-Path "$env:TEMP\test-init\.truent.toml"
        shell: pwsh
        if: runner.os == 'Windows'
        
  
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
        
      - name: Generate coverage
        run: cargo tarpaulin --all --out Xml --timeout 300
        
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
          
  # Benchmark smoke test
  benchmark:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Run benchmark smoke test
        run: cargo bench --no-run
        
  # Determinism check (run tests multiple times)
  determinism:
    name: Determinism Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Run tests multiple times (determinism)
        run: |
          for i in {1..3}; do
            echo "Run $i"
            cargo test --lib --all || exit 1
          done
        
  # Release build
  build-release:
    name: Build Release Binary
    runs-on: ${{ matrix.os }}
    needs: [format, clippy, test, security-tests, audit]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: truent
            asset_name: truent-linux-x86_64
          - os: macos-latest
            artifact_name: truent
            asset_name: truent-macos-x86_64
          - os: windows-latest
            artifact_name: truent.exe
            asset_name: truent-windows-x86_64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      
      - name: Build release
        run: cargo build --release --bin truent --verbose
      
      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/release/${{ matrix.artifact_name }}
        
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}
          retention-days: 30
          
  # Skills are shipped to agent platforms as-is. A malformed SKILL.md does not
  # error at load time — it just stops being selected — so it has to be caught
  # here or not at all.
  skills:
    name: Agent Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      # Frontmatter validity, name/directory agreement, description quality,
      # VERSION agreement, and referenced-file existence.
      - name: Validate SKILL.md frontmatter
        run: python3 tools/validate_skills.py

      # index.json is generated. A PR that edits a description must regenerate
      # it, or discovery tooling serves the old text.
      - name: Check skills/index.json is current
        run: python3 tools/validate_skills.py --check

      # Plugin manifests gate installation; a JSON syntax error makes the
      # whole marketplace entry unloadable.
      #
      # plugin.json is also load-bearing at runtime: truent-skills uses
      # `name == "truent"` in it to decide whether a `skills/` directory is
      # really Truent's, and therefore whether its skills may be labelled
      # ENGINE-BACKED. Renaming it would silently drop the built-ins.
      - name: Validate plugin manifests
        run: |
          python3 - <<'PY'
          import json, sys
          plugin = json.load(open('.claude-plugin/plugin.json'))
          market = json.load(open('.claude-plugin/marketplace.json'))
          if plugin.get('name') != 'truent':
              sys.exit("plugin.json name must be 'truent' — truent-skills uses it "
                       "as the marker for ENGINE-BACKED built-ins")
          names = {p.get('name') for p in market.get('plugins', [])}
          if 'truent' not in names:
              sys.exit("marketplace.json must list a plugin named 'truent'")
          print("OK: plugin manifests valid, name marker intact")
          PY

  # docs/COVERAGE.md is generated from the taxonomy table in truent-core.
  # The table itself is guarded by unit tests (every detector must be mapped,
  # and no row may map a detector that no longer exists); this guards the
  # published document against drifting away from the table.
  coverage-matrix:
    name: Detector Coverage Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build CLI
        run: cargo build --bin truent

      - name: Check docs/COVERAGE.md is current
        run: |
          ./target/debug/truent taxonomy --format markdown --output /tmp/COVERAGE.md
          if ! diff -u docs/COVERAGE.md /tmp/COVERAGE.md; then
            echo "::error::docs/COVERAGE.md is stale. Regenerate with:"
            echo "  truent taxonomy --format markdown --output docs/COVERAGE.md"
            exit 1
          fi
          echo "OK: coverage matrix is current"

  # Final status check
  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    # v0.1: Added cli-smoke-test to verify CLI works on all platforms
    needs: [format, clippy, test, integration-tests, cli-tests, cli-smoke-test, coverage, benchmark, determinism, audit, skills, coverage-matrix]
    steps:
      - name: Confirm all checks passed
        run: echo "All production-grade checks have passed!"
