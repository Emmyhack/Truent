name: Truent Soroban Security Gate

# Run automated invariant checks and security scans on push and PRs touching Soroban contracts.
on:
  push:
    branches: [main, master]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - '.truent.toml'
  pull_request:
    branches: [main, master]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - '.truent.toml'
  workflow_dispatch:

jobs:
  truent-soroban-scan:
    name: Truent Soroban Invariant Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Truent binary
        uses: actions/cache@v4
        id: cache-truent
        with:
          path: ~/.cargo/bin/truent
          key: truent-cli-${{ runner.os }}-v0.6.0

      - name: Install Truent CLI
        if: steps.cache-truent.outputs.cache-hit != 'true'
        run: cargo install truent-cli --locked

      # Alternative: install via npm wrapper if Node.js is already present in your pipeline:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - name: Install Truent via npm
      #   run: npm install -g @dextonicx/cli

      - name: Run Truent Soroban Invariant Scan
        run: |
          truent scan . --chain soroban --fail-on high --sarif truent-soroban-report.sarif

      - name: Upload SARIF report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: truent-soroban-report.sarif
          category: truent-soroban
